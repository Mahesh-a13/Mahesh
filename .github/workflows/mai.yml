name: CI Workflow

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build project
        run: |
          mkdir output
          echo "Hello Artifact" > output/hello.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output/hello.txt


